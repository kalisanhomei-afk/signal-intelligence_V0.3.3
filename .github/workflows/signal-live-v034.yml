name: SIGNAL V0.5.2a date-quality guard + Pages

on:
  workflow_dispatch:
  schedule:
    # UTC 00:27 / 12:27 => Asia/Taipei 08:27 / 20:27
    - cron: '27 0,12 * * *'

# Prevent overlapping edits to history.json. No need for a long-lived server.
concurrency:
  group: signal-live-v034
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline acceptance tests
        run: |
          python scripts/test_pipeline.py
          python scripts/test_governance.py
          python scripts/test_v032.py
          python scripts/test_v033.py
          python scripts/test_v034.py
          python scripts/test_v040.py
          python scripts/test_v041.py
          python scripts/test_v042.py
          python scripts/test_v043.py
          python scripts/test_v044.py
          python scripts/test_v045.py
          python scripts/test_v050.py
          python scripts/test_v051.py
          python scripts/test_v052.py
          python scripts/test_v052a.py
      - name: Collect only rights-reviewed public descriptive metadata
        run: python scripts/collect_v034.py --output data/live_items.json
      - name: Classify unknown/future publication dates and quarantine from latest news
        run: python scripts/date_quality_v052a.py
      - name: Probe newly evaluated public feeds and probe-only endpoints (never republish held content)
        run: python scripts/source_expansion_v044.py
      - name: Assemble bounded intelligence review queue (optional AI)
        env:
          SIGNAL_AI_ENABLED: 'false'  # Avoid automatic paid AI in regular refresh
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.SIGNAL_AI_MODEL }}
        run: python scripts/intelligence_v040.py --max-ai 6
      - name: Generate M0 evidence provenance and verification-gap ledger
        run: python scripts/evidence_v041.py
      - name: Enrich at most 8 arXiv author abstracts through official metadata API (not independently verified)
        run: python scripts/evidence_v042.py --max-new 8
      - name: Audit publisher diversity, domain gaps, and reference readiness (not global recall)
        run: python scripts/source_quality_v043.py
      - name: Build cautious daily review candidates from already-approved metadata (not verified news)
        run: python scripts/daily_candidate_v050.py
      - name: Cross-check external reference candidates (no auto gold labels or global recall)
        run: python scripts/benchmark_v051.py
      - name: Assemble provisional attention reading queue (optional capped AI; never news verification)
        env:
          SIGNAL_V052_AI_ENABLED: 'false'  # Paid AI pilot requires a separate explicit manual-only workflow
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SIGNAL_V052_MODEL: ${{ vars.SIGNAL_V052_MODEL }}
        run: python scripts/impact_review_v052.py --max-ai 6
      - name: Save compact public history on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/date_quality_v052a.json data/live_items.json data/intelligence.json data/evidence_audit.json data/evidence_enriched.json data/source_quality_v043.json data/source_expansion_v044.json data/daily_brief_v050.json data/benchmark_audit_v051.json data/impact_review_v052.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh reviewed metadata [skip ci]"
            git push origin HEAD:main
          else
            echo "No metadata change"
          fi
      - name: Assemble allowlisted public site
        run: python scripts/build_public_site.py --output _site
      - name: Publish collection summary
        run: python scripts/v034_summary.py --input data/live_items.json --output "$GITHUB_STEP_SUMMARY"
      - name: Publish publication-date audit summary
        run: python scripts/v052a_summary.py
      - name: Publish evidence-enrichment status (M1 is author metadata, never verification)
        run: python scripts/v042_summary.py --evidence data/evidence_enriched.json --append "$GITHUB_STEP_SUMMARY"
      - name: Publish source-coverage limitations and missing benchmark warning
        run: python scripts/v043_summary.py --input data/source_quality_v043.json --append "$GITHUB_STEP_SUMMARY"
      - name: Publish admission and license gate report
        run: python scripts/v044_summary.py
      - name: Report two new reviewed source pilots and licensing blocks
        run: python scripts/v045_summary.py
      - name: Publish V0.5 daily candidates and source-gap warning
        run: python scripts/v050_summary.py
      - name: Publish V0.5.1 reviewed benchmark readiness (not news recall)
        run: python scripts/v051_summary.py
      - name: Report provisional V0.5.2 candidate attention (never accuracy)
        run: python scripts/v052_summary.py
      - name: Upload metadata report for audit
        uses: actions/upload-artifact@v4
        with:
          name: signal-v052a-date-provenance-and-quality-gates
          path: |
            data/date_quality_v052a.json
            data/live_items.json
            data/intelligence.json
            data/daily_brief_v050.json
            data/benchmark_audit_v051.json
            data/impact_review_v052.json
            data/evidence_audit.json
            data/evidence_enriched.json
            data/source_quality_v043.json
            data/source_expansion_v044.json
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: collect-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
