name: SIGNAL R6 isolated branch QA + optional one paid call

# Branch-isolated push workflow. Approval is computed from the checked-out
# commit and reported in the Actions summary, avoiding brittle push payload
# `head_commit.modified` job-level conditions.
on:
  push:
    branches:
      - signal-evidence-rebuild
    paths:
      - 'rebuild_r6/**'
      - '.github/workflows/signal-evidence-r6-branch.yml'

permissions:
  contents: read

concurrency:
  group: signal-r6-branch-safe
  cancel-in-progress: false

jobs:
  offline_qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R5 offline gate (80 legacy tests + exact pinned files)
        run: python rebuild_r5/qa_gate.py --root . --out "$RUNNER_TEMP/r5qa"
      - name: R6 unit tests (no billable calls)
        run: python -m unittest discover -s rebuild_r6 -p 'test_*.py' -v
      - name: R6 offline dry run (no billable calls)
        run: python rebuild_r6/r6_pilot.py --root . --out "$RUNNER_TEMP/r6offline"
      - name: Archive offline QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-r6-offline-qa
          path: |
            ${{ runner.temp }}/r5qa/
            ${{ runner.temp }}/r6offline/
          if-no-files-found: warn
          retention-days: 14

  approval_gate:
    needs: offline_qa
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.guard.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine exact one-call approval (NO API)
        id: guard
        shell: bash
        run: |
          approved=false
          reason='not requested'
          if [[ "$GITHUB_EVENT_NAME" != 'push' ]]; then
            reason='not a push event'
          elif [[ "$GITHUB_REPOSITORY" != 'kalisanhomei-afk/signal-intelligence_V0.3.3' ]]; then
            reason='repository mismatch'
          elif [[ "$GITHUB_REF" != 'refs/heads/signal-evidence-rebuild' ]]; then
            reason='branch mismatch'
          elif [[ "$GITHUB_ACTOR" != 'kalisanhomei-afk' ]]; then
            reason='actor mismatch'
          elif [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            reason='rerun not authorized'
          elif [[ "$(git log -1 --format=%s)" != 'SIGNAL_R6_APPROVE_ONE_PAID_CALL' ]]; then
            reason='commit summary not approval phrase'
          elif ! grep -Fxq 'APPROVE_ONE_CALL=YES' rebuild_r6/APPROVE_ONE_CALL.txt; then
            reason='approval marker not YES'
          elif ! git diff --name-only HEAD^ HEAD | grep -Fxq 'rebuild_r6/APPROVE_ONE_CALL.txt'; then
            reason='approval marker not modified in this commit'
          else
            approved=true
            reason='all checks passed'
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
          echo "### R6 authorization gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Approved for at most one API call: **$approved**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate diagnosis: $reason" >> "$GITHUB_STEP_SUMMARY"

  one_paid_call:
    needs: [offline_qa, approval_gate]
    if: needs.approval_gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-check one-call marker and prevent billable reruns
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = '1'
          grep -Fxq 'APPROVE_ONE_CALL=YES' rebuild_r6/APPROVE_ONE_CALL.txt
      - name: Run exactly one OpenAI API request (no retries, no site publish)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python rebuild_r6/r6_pilot.py --root . --out "$RUNNER_TEMP/r6live" --live
      - name: Preserve sanitized technical result for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-r6-one-bea-live-manual-review
          path: ${{ runner.temp }}/r6live/
          if-no-files-found: warn
          retention-days: 14
